services:
  app:
    build:
      context: .
      target: prod
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URI=redis://redis:6379
      - HTTP_CACHE_REDIS_URI=redis://redis:6379
      - HTTP_CACHE_READONLY_FALLBACK_REDIS_URI=redis://localhost:6379
      - POSTGRES_URL=postgres://postgres:password@postgres:5432
      - SMTP_URI=smtp://mailpit:1025
    ports:
      - 3000:3000
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - 1080:8025
      - 1025:1025
  nginx:
    image: nginx:1.31.8
    ports:
      - 443:443
    volumes:
      - './.dev:/etc/nginx:ro'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  opentelemetry:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - 3001:3000
      - 4317:4317
      - 4318:4318
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ['CMD', 'pg_isready', '--username', 'postgres']
      interval: 1s
      timeout: 1s
      retries: 30
  redis:
    build:
      context: .
      target: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
      retries: 30
